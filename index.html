<!doctype html>
<html lang="en">
  <head>
    <script>
      // Ignore HMR and WebSocket errors as HMR is disabled in AI Studio preview
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWebSocket = window.WebSocket;
          var MockWebSocket = function(url, protocols) {
            if (
              typeof url === 'string' &&
              (url.indexOf('vite') !== -1 || url.indexOf('hmr') !== -1 || url.indexOf('run.app') !== -1)
            ) {
              var listeners = {};
              return {
                readyState: 3, // CLOSED
                url: url,
                protocol: '',
                extensions: '',
                bufferedAmount: 0,
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return false; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
            }
            return new OriginalWebSocket(url, protocols);
          };
          MockWebSocket.prototype = OriginalWebSocket.prototype;
          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          window.WebSocket = MockWebSocket;
        }

        window.addEventListener('error', function(e) {
          var msg = (e.message || '') + (e.error ? ' ' + e.error.message : '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('[vite]') !== -1 ||
            (e.filename && e.filename.indexOf('@vite/client') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason && (e.reason.message || String(e.reason));
          if (
            reason && (
              reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('websocket') !== -1 ||
              reason.indexOf('[vite]') !== -1
            )
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          var secondArg = arguments[1];
          var msg = (typeof firstArg === 'string' ? firstArg : (firstArg && firstArg.message) || '') +
                    ' ' + (typeof secondArg === 'string' ? secondArg : (secondArg && secondArg.message) || '');
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1
          ) {
            console.debug.apply(console, arguments);
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>

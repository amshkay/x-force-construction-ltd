<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background with slight rounded corners for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="96" />
  
  <!-- Architectural X-Force Brick geometric symbol in central safe zone -->
  <g transform="translate(96, 96)">
    <!-- Top left brick -->
    <rect x="16" y="24" width="136" height="60" rx="8" fill="url(#brickGrad)" />
    <!-- Top right brick -->
    <rect x="168" y="24" width="136" height="60" rx="8" fill="url(#brickGrad)" />
    
    <!-- Middle offset brick (Center interlocking block) -->
    <rect x="68" y="100" width="184" height="64" rx="8" fill="#f97316" />
    <path d="M120 100 L200 164 M200 100 L120 164" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9" />

    <!-- Bottom left brick -->
    <rect x="16" y="180" width="136" height="60" rx="8" fill="url(#brickGrad)" />
    <!-- Bottom right brick -->
    <rect x="168" y="180" width="136" height="60" rx="8" fill="url(#brickGrad)" />

    <!-- Solid foundation line -->
    <rect x="16" y="256" width="288" height="16" rx="6" fill="#38bdf8" />
  </g>
</svg>
